name: Batch 7 final regression
on:
  push:
    branches:
      - batch7-final-seo-a11y
      - batch7-production-release
  pull_request:
    branches:
      - main
concurrency:
  group: batch7-final-regression
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save jsdom@26.1.0
      - name: Syntax check final runtimes
        run: |
          node --check public/app.js
          node --check public/conversion-v1.js
          node --check public/product-page-v1.js
          node --check public/seo-a11y-v1.js
          node --check public/checkout.js
          node --check public/account.js
          node --check public/wholesale-v1.js
          node --check public/admin-wholesale.js
          node --check public/customer-notifications-v1.js
          node --check public/admin-notifications-v1.js
          node --check public/admin-config.js
      - name: Batch 7 static production gate
        run: node tests/batch7-static-regression.cjs
      - name: Today mobile UI regression
        run: node tests/today-ui-mobile-regression.cjs
      - name: Wholesale business orders regression
        run: node tests/wholesale-regression.cjs
      - name: Wholesale form behavior regression
        run: node tests/wholesale-ui-regression.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
      - name: Quick View regression matrix
        run: node tests/quick-view-regression.cjs
      - name: Mobile stability and auth
        run: node tests/mobile-stability.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
      - name: Account dashboard viewport regression
        run: node tests/mobile-dashboard.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
