name: Generate brand favicons

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-favicons.yml"
      - "public/favicon.jpg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate favicon formats from the original logo
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("public/favicon.jpg")
          with Image.open(source) as raw:
              image = raw.convert("RGB")
          if image.width != image.height:
              raise ValueError("Brand logo must be square; refusing to crop or distort it.")
          for size, file in (
              (96, "favicon-96x96.png"),
              (192, "favicon-192x192.png"),
              (180, "apple-touch-icon.png"),
          ):
              image.resize((size, size), Image.Resampling.LANCZOS).save(
                  Path("public") / file, format="PNG", optimize=True
              )
          image.save(
              "public/favicon.ico",
              format="ICO",
              sizes=[(16, 16), (32, 32), (48, 48), (64, 64)],
          )
          print("Generated favicon.ico, favicon PNGs and Apple touch icon from unchanged favicon.jpg")
          PY
      - name: Commit generated image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.ico public/favicon-96x96.png public/favicon-192x192.png public/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Favicon files are up to date."
            exit 0
          fi
          git commit -m "assets: generate PNG and ICO favicons from approved logo"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Favicon assets committed to main."
              exit 0
            fi
            sleep 2
          done
          echo "Unable to push generated icons without conflict." >&2
          exit 1
