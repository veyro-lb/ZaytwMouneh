name: Gift packaging production verification

on:
  push:
    branches: [main]
    paths:
      - "public/gift.html"
      - "public/gift-example-v1.css"
      - "public/assets/gifts/gift-wrapped-olive-oil-example.webp"
      - ".github/workflows/gift-example-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify gift photo and CTA on Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for the Gift page and image to publish
        shell: bash
        run: |
          set -euo pipefail
          base="https://zaytwmouneh.com"
          for attempt in $(seq 1 18); do
            echo "Checking Gift page deployment: attempt $attempt/18"
            html="$(curl -fsSL --retry 1 --max-time 15 -H 'Cache-Control: no-cache' "$base/gift.html?gift_photo_version=20261031_hd2" 2>/dev/null || true)"
            if [[ "$html" == *'id="giftPresentation"'* ]] &&
               [[ "$html" == *'gift-example-v1.css?v=20261031-giftphoto1'* ]] &&
               [[ "$html" == *'href="/gift#gift"'* ]]; then
              css="$(curl -fsSL --max-time 15 "$base/gift-example-v1.css?v=20261031-giftphoto1" 2>/dev/null || true)"
              if [[ "$css" == *'.gift-example-card'* ]] &&
                 curl -fsSL --max-time 15 "$base/assets/gifts/gift-wrapped-olive-oil-example.webp?v=20261031-gifthd2" -o /tmp/zwm-gift-photo.webp 2>/dev/null &&
                 [[ "$(head -c 4 /tmp/zwm-gift-photo.webp)" == "RIFF" ]] &&
                 [[ "$(wc -c < /tmp/zwm-gift-photo.webp)" -ge 60000 ]]; then
                echo "PASS: Live Gift HTML, styles, genuine photo, and builder link are published."
                exit 0
              fi
            fi
            sleep 12
          done
          echo "::error::The Gift feature is committed but not yet published on the Cloudflare production domain. Inspect Cloudflare Workers Git builds."
          exit 1
