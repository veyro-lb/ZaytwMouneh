name: Live storefront probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-storefront-probe.yml
      - "public/**"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read deployed homepage and shell
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          base="https://zaytwmouneh.veyro-202.workers.dev"
          expected="storefront-shell.css?v=20261008-desktopmenufix4"
          html="$(curl -fsSL --max-time 20 "$base/")"
          token="$(printf '%s' "$html" | grep -oE 'storefront-shell\.css\?v=[^" >]+' | head -1 || true)"
          release="$(printf '%s' "$html" | grep -oE 'name="zwm-release" content="[^"]+"' | head -1 || true)"
          echo "LIVE_SHELL_TOKEN=$token"
          echo "EXPECTED_SHELL_TOKEN=$expected"
          echo "LIVE_RELEASE=$release"
          release_js="$(curl -fsSL --max-time 20 "$base/storefront-release.js?t=$(date +%s)")"
          if printf '%s' "$release_js" | grep -q 'SHELL_ASSET_VERSION="20261008-desktopmenufix4"'; then
            echo "LIVE_RELEASE_HELPER_SHELL_PIN=present"
          else
            echo "LIVE_RELEASE_HELPER_SHELL_PIN=missing"
          fi
          if [ "$token" != "$expected" ]; then
            echo "::warning::Live HTML has not reached the latest shell token yet."
          fi
          if [ -n "$token" ]; then
            css="$(curl -fsSL --max-time 20 "$base/$token")"
            printf '%s' "$css" | grep -q 'desktop/tablet menu fit refinement' && echo "LIVE_DESKTOP_REFINEMENT=present"
            printf '%s' "$css" | grep -q 'min-width:94px!important' && echo "LIVE_DESKTOP_BUTTON_RULE=present"
            printf '%s' "$css" | grep -q 'top:calc(100% + 14px)!important' && echo "LIVE_DESKTOP_PANEL_ANCHOR=present"
          fi
