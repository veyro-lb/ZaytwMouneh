name: Owner notifications smoke checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "public/admin.js"
      - "public/admin.html"
      - "public/admin-notifications-v1.js"
      - "public/notifications-v1.css"
      - "tests/notification-security-regression.cjs"
      - ".github/workflows/owner-notifications-smoke.yml"
  workflow_dispatch:

jobs:
  admin-notifications:
    name: Owner push and dashboard regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check public/admin.js
          node --check public/admin-notifications-v1.js
      - name: Check notification security and device wiring
        run: node tests/notification-security-regression.cjs
