name: Production Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Production architecture checks
        run: node tests/production-contract.cjs
      - name: JavaScript syntax checks
        shell: bash
        run: |
          node --check worker.js
          find public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
