name: Production regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Production regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pinned lockfile for Batch 1 bootstrap
        run: npm install --package-lock-only --ignore-scripts
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Syntax and production regression checks
        run: npm run check
