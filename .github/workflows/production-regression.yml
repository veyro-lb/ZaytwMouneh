name: Production regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Production regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax and production regression checks
        run: npm run check
      - name: Install free browser regression tooling
        id: install-browsers
        if: ${{ always() }}
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Real browser responsive regression
        if: ${{ always() && steps.install-browsers.outcome == 'success' }}
        run: npm run test:browser
