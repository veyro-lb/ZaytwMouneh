name: Production regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Production regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard production source of truth
        env:
          ZWM_GIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ZWM_GIT_HEAD: ${{ github.sha }}
        run: node scripts/guard-source-of-truth.cjs
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax and production regression checks
        run: npm run check
