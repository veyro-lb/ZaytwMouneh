name: Storefront QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save jsdom@26.1.0
      - run: NODE_PATH="$(npm root)" node tests/mobile-stability.cjs
      - run: NODE_PATH="$(npm root)" node tests/mobile-dashboard.cjs
      - run: node tests/commerce-contract.cjs
